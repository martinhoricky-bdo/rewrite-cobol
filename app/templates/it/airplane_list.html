{% extends "base.html" %}{% block content %}<h1>Airplanes</h1><p><a href="{% url 'it:airplane_create' %}">New airplane</a></p><table><thead><tr><th>AIRPLANEID</th><th>TYPE</th><th>NUMSEATS</th><th>TOTALFUEL</th><th>ACTIONS</th></tr></thead><tbody>{% for item in airplanes %}<tr><td>{{ item.airplaneid }}</td><td>{{ item.type }}</td><td>{{ item.numseats }}</td><td>{{ item.totalfuel }}</td><td><a href="{% url 'it:airplane_edit' item.pk %}">Edit</a> <a href="{% url 'it:airplane_delete' item.pk %}">Delete</a></td></tr>{% endfor %}</tbody></table>{% endblock %}
