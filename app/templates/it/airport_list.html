{% extends "base.html" %}{% block content %}<h1>Airports</h1><p><a href="{% url 'it:airport_create' %}">New airport</a></p><table><thead><tr><th>AIRPORTID</th><th>NAME</th><th>ADDRESS</th><th>CITY</th><th>COUNTRY</th><th>ZIPCODE</th><th>ACTIONS</th></tr></thead><tbody>{% for item in airports %}<tr><td>{{ item.airportid }}</td><td>{{ item.name }}</td><td>{{ item.address }}</td><td>{{ item.city }}</td><td>{{ item.country }}</td><td>{{ item.zipcode }}</td><td><a href="{% url 'it:airport_edit' item.pk %}">Edit</a> <a href="{% url 'it:airport_delete' item.pk %}">Delete</a></td></tr>{% endfor %}</tbody></table>{% endblock %}
