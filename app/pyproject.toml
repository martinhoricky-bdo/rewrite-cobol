[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobol-airlines"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<5.2",
  "psycopg[binary]>=3.1",
  "django-environ>=0.11",
  "argon2-cffi>=23",
  "gunicorn>=22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-django>=4.8",
  "factory-boy>=3.3",
  "freezegun>=1.4",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["accounts*", "config*", "core*", "fleet*", "operations*", "sales*", "legacy_import*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
per-file-ignores = { "*/migrations/*" = ["E501"] }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
